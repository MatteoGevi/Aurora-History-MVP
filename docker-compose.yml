# ─────────────────────────────────────────────────────────────
# Aurora — docker-compose.yml for LOCAL DEVELOPMENT only
#
# Usage:
#   docker compose up
#
# Secrets:
#   Copy .env.example → .env and fill in your values.
#   The .env file is in .gitignore and NEVER committed to git.
# ─────────────────────────────────────────────────────────────

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env                      # reads all vars from your local .env
    environment:
      - PORT=8501
    volumes:
      # Hot reload in development: mount source dirs as volumes
      - ./app:/app/app
      - ./src:/app/src
      - ./config:/app/config
    restart: unless-stopped

