# docker-compose.yml (Future)
version: '3.8'

services:
  # Frontend
  web:
    build: ./app
    ports:
      - "8501:8501"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
  
  # Background worker for PDF ingestion
  worker:
    build: ./ingest
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./data:/data
  
  # API (optional)
  api:
    build: ./api
    ports:
      - "8000:8000"