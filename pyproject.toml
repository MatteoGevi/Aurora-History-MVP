[tool.poetry]
name = "aurora-history-mvp"
version = "0.1.0"
description = "Aurora — AI-powered educational assessment platform"
authors = ["Matteo Gevi <matteogevi97@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# ── UI ────────────────────────────────────────────────────
streamlit                = ">=1.50.0,<2.0.0"
pillow                   = ">=11.3.0,<12.0.0"

# ── PDF processing ────────────────────────────────────────
pymupdf                  = ">=1.26.3,<1.27"

# ── AI / LLM ──────────────────────────────────────────────
anthropic                = ">=0.40.0"
openai                   = ">=1.106.1,<2.0.0"
ollama                   = ">=0.6.0,<0.7.0"

# ── Embeddings & NLP ──────────────────────────────────────
sentence-transformers    = ">=3.0.0"
spacy                    = ">=3.8.7,<4.0.0"
langchain-text-splitters = ">=0.3.11,<0.4.0"
numpy                    = ">=1.26"

# ── Database ──────────────────────────────────────────────
supabase                 = ">=2.18.1,<3.0.0"

# ── Utils ─────────────────────────────────────────────────
pydantic                 = ">=2.11.7,<3.0.0"
python-dotenv            = ">=1.0.0"
requests                 = ">=2.32.0"

[tool.poetry.group.dev.dependencies]
ipykernel  = "^6.30.1"
jupyterlab = "^4.4.7"

[build-system]
requires      = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
